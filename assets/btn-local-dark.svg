<svg xmlns="http://www.w3.org/2000/svg" width="250" height="64" viewBox="0 0 250 64" role="img" aria-label="CAMAÇARI">
<title>CAMAÇARI</title>
<style>
  .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0px); } }
  .rv { opacity: 0; animation: rise 0.8s cubic-bezier(.2,.7,.2,1) forwards; }

  @keyframes sweep { from { transform: translateX(-140px) skewX(-20deg); } to { transform: translateX(290px) skewX(-20deg); } }
  .shine { animation: sweep 1.6s ease-in-out 1.35s 1 both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; }
    .rv { opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8B04A"/><stop offset="0.5" stop-color="#F4D58D"/><stop offset="1" stop-color="#B97F22"/></linearGradient>
  <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="125" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#E8B04A"/><stop offset="0.33" stop-color="#F4D58D"/><stop offset="0.66" stop-color="#B97F22"/><stop offset="1" stop-color="#E8B04A"/>
  </linearGradient>
  <linearGradient id="spin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8B04A"/><stop offset="0.5" stop-color="#F4D58D"/><stop offset="1" stop-color="#B97F22"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="btn"><rect x="2" y="2" width="246" height="60" rx="30"/></clipPath>
</defs>
<rect x="1" y="1" width="248" height="62" rx="31" fill="#15171C" stroke="url(#spin)" stroke-width="2.2"/>
<g clip-path="url(#btn)"><rect class="shine" x="0" y="0" width="90" height="64" fill="url(#sh)"/></g>
<circle cx="38" cy="32" r="21" fill="url(#brand)"/>
<g transform="translate(27 21) scale(0.9166666666666666)" fill="none" stroke="#fff" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></g>
<text x="72" y="29" class="sans" font-size="15" font-weight="800" letter-spacing="2.4" fill="#F3F0E8">CAMAÇARI</text>
<text x="72" y="47" class="mono" font-size="12" fill="#9AA0AC">Bahia · Brasil</text>
<g transform="translate(206 23) scale(0.75)" fill="none" stroke="#E8B04A" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g>
</svg>
