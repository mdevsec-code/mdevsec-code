<text class="line" x="32" y="194" style="animation-delay:2.30s"><tspan fill="#8B949E">BI, processos e automação na ENGENOVA, dentro da fábrica da BYD</tspan></text>
<text class="line" x="32" y="228" style="animation-delay:2.70s"><tspan fill="#3FB950">murilo@engenova</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#2F81F7">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#E6EDF3">ls projetos/</tspan></text>
