<text class="line" x="32" y="92" style="animation-delay:0.40s"><tspan fill="#3FB950">murilo@engenova</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#2F81F7">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text>
