<text class="line" x="40" y="262" style="animation-delay:3.75s"><tspan fill="#0969DA" font-weight="600">falcao-saude-ocupacional/</tspan>   <tspan fill="#0969DA" font-weight="600">falcao-erp-suprimentos/</tspan>   <tspan fill="#0969DA" font-weight="600">controle-de-epi/</tspan></text>
