  @keyframes fillx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .fill { transform-box: fill-box; transform-origin: left; animation: fillx 1.6s cubic-bezier(.2,.7,.2,1) both; }
  @media (prefers-reduced-motion: reduce) {
