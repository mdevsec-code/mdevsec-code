<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="01 — Sobre mim">
<title>01 — Sobre mim</title>
<style>
  .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }

  @keyframes drift { 0%, 100% { transform: translate(0px, 0px) scale(1); } 50% { transform: translate(60px, 24px) scale(1.12); } }
  .aur { transform-box: fill-box; transform-origin: center; animation: drift 14s ease-in-out infinite; }
  .a2 { animation-duration: 18s; animation-direction: reverse; }
  .a3 { animation-duration: 16s; animation-delay: -6s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0px); } }
  .rv { opacity: 0; animation: rise 0.8s cubic-bezier(.2,.7,.2,1) forwards; }

  @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1040px); } }
  .scan { animation: scan 4.2s cubic-bezier(.6,0,.3,1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; }
    .rv { opacity: 1 !important; transform: none !important; }
  }
</style>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset="0.5" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
  <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#0891B2"/><stop offset="0.33" stop-color="#7C3AED"/><stop offset="0.66" stop-color="#DB2777"/><stop offset="1" stop-color="#0891B2"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="halo" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="seg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2" stop-opacity="0"/><stop offset="0.5" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777" stop-opacity="0"/></linearGradient></defs><text x="2" y="56" class="mono" font-size="20" font-weight="700" fill="url(#brand)">01<tspan fill="#8A94B4" font-weight="400" font-size="16"> //</tspan></text>
<text x="76" y="58" class="sans" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#0B1022">Sobre mim</text>
<text x="996" y="54" text-anchor="end" class="mono" font-size="15" fill="#566182"><tspan fill="#0891B2">$</tspan> neofetch</text><rect x="0" y="88" width="1000" height="2" rx="1" fill="#E1E6F4"/>
<rect x="0" y="88" width="120" height="2" rx="1" fill="url(#brand)"/>
<rect class="scan" x="0" y="87" width="180" height="4" rx="2" fill="url(#seg)"/>
