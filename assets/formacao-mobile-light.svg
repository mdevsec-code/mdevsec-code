<svg xmlns="http://www.w3.org/2000/svg" width="460" height="556" viewBox="0 0 460 556" role="img" aria-label="Formação: Bacharelado em Sistemas de Informação, UNIME, 8º semestre. Idiomas: português nativo, inglês avançado."><title>Formação e idiomas</title><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#EAEEF2" stroke-width="1"/></pattern><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#0969DA"/><stop offset="1" stop-color="#8250DF"/></linearGradient></defs><style>
