<svg xmlns="http://www.w3.org/2000/svg" width="250" height="64" viewBox="0 0 250 64" role="img" aria-label="E-MAIL">
<title>E-MAIL</title>
<style>
  .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }

  @keyframes drift { 0%, 100% { transform: translate(0px, 0px) scale(1); } 50% { transform: translate(60px, 24px) scale(1.12); } }
  .aur { transform-box: fill-box; transform-origin: center; animation: drift 14s ease-in-out infinite; }
  .a2 { animation-duration: 18s; animation-direction: reverse; }
  .a3 { animation-duration: 16s; animation-delay: -6s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0px); } }
  .rv { opacity: 0; animation: rise 0.8s cubic-bezier(.2,.7,.2,1) forwards; }

  @keyframes sweep { 0% { transform: translateX(-140px) skewX(-20deg); } 60%, 100% { transform: translateX(290px) skewX(-20deg); } }
  .shine { animation: sweep 4.5s ease-in-out 0.6s infinite; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; }
    .rv { opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="125" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="0.33" stop-color="#8B5CF6"/><stop offset="0.66" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="125 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="halo" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="spin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" begin="-1.5s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="btn"><rect x="2" y="2" width="246" height="60" rx="30"/></clipPath>
</defs>
<rect x="1" y="1" width="248" height="62" rx="31" fill="#0B1124" stroke="url(#spin)" stroke-width="2.2"/>
<g clip-path="url(#btn)"><rect class="shine" x="0" y="0" width="90" height="64" fill="url(#sh)"/></g>
<circle cx="38" cy="32" r="21" fill="url(#brand)"/>
<g transform="translate(27 21) scale(0.9166666666666666)" fill="none" stroke="#fff" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5 12 13l8.5-5.5"/></g>
<text x="72" y="29" class="sans" font-size="15" font-weight="800" letter-spacing="2.4" fill="#EEF2FF">E-MAIL</text>
<text x="72" y="47" class="mono" font-size="12" fill="#8C96BA">resposta rápida</text>
<g transform="translate(206 23) scale(0.75)" fill="none" stroke="#22D3EE" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g>
</svg>
