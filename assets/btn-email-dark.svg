<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="EMAIL">
<title>EMAIL</title>
<defs>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#2F81F7"/><stop offset="1" stop-color="#A371F7"/></linearGradient>
  <pattern id="g" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#21262D" stroke-width="1"/></pattern>
  <clipPath id="c"><rect x="1" y="1" width="238" height="62" rx="12"/></clipPath>
</defs>
<style>

  .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }

  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0px); } }
  .all { opacity: 0; animation: in 0.6s ease-out 3.75s forwards; }
  @keyframes trace { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
  .trace { stroke-dasharray: 80 520; animation: trace 6s linear 0.35s infinite; }
  @keyframes shine { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(360px); } }
  .shine { animation: shine 7s ease-in-out 4.35s infinite; }
  @media (prefers-reduced-motion: reduce) { .all, .trace, .shine { animation: none !important; opacity: 1; } .trace { opacity: 0; } }
</style>
<g class="all">
  <g clip-path="url(#c)">
    <rect width="240" height="64" fill="#161B22"/>
    <rect width="240" height="64" fill="url(#g)" opacity="0.6"/>
    <rect class="shine" x="0" y="0" width="60" height="64" fill="#2F81F7" opacity="0.07" transform="skewX(-20)"/>
  </g>
  <rect x="1" y="1" width="238" height="62" rx="12" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <rect class="trace" x="1" y="1" width="238" height="62" rx="12" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(20 21)"><rect x="1" y="3" width="20" height="16" rx="3" fill="none" stroke="#2F81F7" stroke-width="2"/><path d="M2 5l9 7 9-7" fill="none" stroke="#2F81F7" stroke-width="2" stroke-linejoin="round"/></g>
  <text x="58" y="30" class="mono" font-size="15" font-weight="700" letter-spacing="1" fill="#E6EDF3">EMAIL</text>
  <text x="58" y="49" class="mono" font-size="11.5" fill="#8B949E">fale comigo</text>
  <path d="M214 26l6 6-6 6" fill="none" stroke="#8B949E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
