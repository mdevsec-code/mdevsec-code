<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="">
<defs>
  <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#2F81F7" stop-opacity="0"/><stop offset="0.5" stop-color="#2F81F7"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></linearGradient>
</defs>
<style>
  @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1200px); } }
  .beam { animation: sweep 4.5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .beam { animation: none; opacity: 0; } }
</style>
<line x1="0" y1="12" x2="1200" y2="12" stroke="#30363D" stroke-width="1"/>
<rect class="beam" x="0" y="11" width="260" height="2" fill="url(#beam)"/>
<rect x="594" y="6" width="12" height="12" transform="rotate(45 600 12)" fill="#0D1117" stroke="#2F81F7" stroke-width="1.5"/>
</svg>
