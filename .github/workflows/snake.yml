name: Cobrinha das contribuições

# Gera, todo dia, a animação da cobrinha comendo o gráfico de contribuições
# (tema claro e escuro) e publica no branch `output`, de onde o README lê.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: atualiza a cobrinha das contribuições'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
